    <script>
    async function addToCart(event, productId, wholesaleId, quantity) {
  // Prevent the default button click action
  event.preventDefault();

  // Ensure the user is logged in
  const userData = localStorage.getItem('userData');
  if (!userData) {
    window.location.href = 'login.html'; // Redirect to login page if not logged in
    return;
  }

  const user = JSON.parse(userData);
  console.log('User data:', user);

  // Ensure quantity is a number (default to 1 if not provided)
  quantity = quantity || 1;

  try {
    // Construct URL for adding product to the cart
    let url = `http://localhost:3000/api/wholesalecart/${user._id}/add`;

    // Send request to backend to add product to cart
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        userId: user._id,       // Send user ID from localStorage
        productId: productId,   // Send product ID
        wholesaleId: wholesaleId, // Send wholesale ID (empty string for non-wholesale)
        quantity: quantity      // Send quantity (default to 1)
      })
    });

    const result = await response.json();

    if (result.success) {
      alert('Product added to cart successfully!');
      // Optionally redirect to the cart page or refresh the page
    } else {
      alert(result.message || 'Failed to add product to cart');
    }
  } catch (error) {
    console.error('Error adding to cart:', error);
    alert('Failed to add product to cart. Please try again.');
  }
}


       async function loadWholesaleProducts() {
        try {
            const response = await fetch("http://localhost:3000/api/wholesales");
            if (!response.ok) throw new Error('HTTP error! Status: ${response.status}');
            
            const result = await response.json();
            if (!result.success || !result.data.length) throw new Error("No wholesale products found!");

            allProducts = result.data; // Store all products globally
            displayProducts(allProducts); // Display all products initially
        } catch (error) {
            console.error("❌ Error loading wholesale products:", error);
            alert("Error loading wholesale products: " + error.message);
        }
    }

    // Display products
    function displayProducts(products) {
  const wholesaleGrid = document.getElementById("wholesale-products");
  wholesaleGrid.innerHTML = ""; // Clear previous products

  if (Array.isArray(products) && products.length > 0) {
    products.forEach(product => {
      const price = product.price_per_unit ?? 0;

      const card = document.createElement("div");
      card.classList.add("product-card");
      card.setAttribute("data-id", product._id); // Set product ID

      card.innerHTML = `
          <div class="product-image">
                    <img src="${product.image }" alt="${product.name}">
                </div>
          <div class="product-info">
            <h3 class="product-name">${product.name}</h3>
            <div class="product-price">RM ${(product.price || 0).toFixed(2)}</div>
            <div class="product-min-order">Min Order: ${product.minOrder}</div>
            <div class="product-stock">Stock: ${product.stock}</div>
            <button onclick="addToCart(event, '${product._id}', '${product.type === 'Wholesale' ? product._id : ''}', 1)" class="add-to-cart-btn" 
              ${product.stock <= 0 ? 'disabled' : ''}>
              ${product.stock > 0 ? 'Add to Cart' : 'Out of Stock'}
            </button>

          </div>
        </div>
      `;
      // Add click listener to card (not on button)
      card.addEventListener("click", function (e) {
        if (!e.target.classList.contains("add-to-cart-btn")) {
          const id = this.getAttribute("data-id");
          window.location.href = `wholesaleDetails.html?id=${id}`;
        }
      });

      wholesaleGrid.appendChild(card);
    });
    
  } else {
    document.getElementById('messageArea').innerHTML = 'No products found.';
  }
}
    // Filter products based on search input
    function filterProducts() {
    const searchInputElement = document.getElementById('searchInput');
    if (!searchInputElement) {
        console.error("searchInput element not found.");
        return;
    }

    const searchValue = searchInputElement.value.toLowerCase();

    const filteredProducts = allProducts.filter(product =>
        product.name && product.name.toLowerCase().includes(searchValue)
    );

    displayProducts(filteredProducts);
}

function generateObjectId() {
    const timestamp = Math.floor(new Date().getTime() / 1000).toString(16);
    const machineId = Math.floor(Math.random() * 16777216).toString(16).padStart(6, '0');
    const processId = Math.floor(Math.random() * 65536).toString(16).padStart(4, '0');
    const counter = Math.floor(Math.random() * 16777216).toString(16).padStart(6, '0');
    return timestamp + machineId + processId + counter;
}
// 确保批发产品数据有效的函数，匹配真实的wholesales集合结构
function ensureValidWholesaleData(wholesale) {
    if (!wholesale) return null;
    
    // 创建副本以避免修改原始数据
    const fixedWholesale = {...wholesale};
    
    // 处理MongoDB ObjectId格式
    if (fixedWholesale._id && typeof fixedWholesale._id === 'object' && fixedWholesale._id.$oid) {
        // 保持原样，已经是正确的格式
    } else if (fixedWholesale._id) {
        try {
            // 尝试将现有ID转换为正确的MongoDB格式
            fixedWholesale._id = { $oid: fixedWholesale._id.toString() };
        } catch (e) {
            console.error("Error converting _id to string:", e);
            fixedWholesale._id = { $oid: generateObjectId() };
        }
    } else if (fixedWholesale.id) {
        // 如果使用id而不是_id
        try {
            fixedWholesale._id = typeof fixedWholesale.id === 'object' && fixedWholesale.id.$oid ? 
                fixedWholesale.id : { $oid: fixedWholesale.id.toString() };
        } catch (e) {
            console.error("Error converting id to _id:", e);
            fixedWholesale._id = { $oid: generateObjectId() };
        }
    } else {
        // 生成临时ID
        fixedWholesale._id = { $oid: generateObjectId() };
    }
    
    // 处理价格（确保它是MongoDB NumberInt格式）
    if (fixedWholesale.price && typeof fixedWholesale.price === 'object' && fixedWholesale.price.$numberInt) {
        // 保持原样，已经是正确的格式
    } else if (fixedWholesale.price !== undefined) {
        fixedWholesale.price = { $numberInt: String(parseInt(fixedWholesale.price, 10)) };
    } else {
        fixedWholesale.price = { $numberInt: "0" };
    }
    
    // 处理最小订单量
    if (fixedWholesale.minOrder && typeof fixedWholesale.minOrder === 'object' && fixedWholesale.minOrder.$numberInt) {
        // 保持原样
    } else if (fixedWholesale.minOrder !== undefined) {
        fixedWholesale.minOrder = { $numberInt: String(parseInt(fixedWholesale.minOrder, 10)) };
    } else {
        fixedWholesale.minOrder = { $numberInt: "6" }; // 默认最小订单量
    }
    
    // 处理库存
    if (fixedWholesale.stock && typeof fixedWholesale.stock === 'object' && fixedWholesale.stock.$numberInt) {
        // 保持原样
    } else if (fixedWholesale.stock !== undefined) {
        fixedWholesale.stock = { $numberInt: String(parseInt(fixedWholesale.stock, 10)) };
    } else {
        fixedWholesale.stock = { $numberInt: "0" }; // 默认库存
    }
    
    // 确保其他字段存在
    if (!fixedWholesale.description) fixedWholesale.description = "No description available.";
    if (!fixedWholesale.category) fixedWholesale.category = "Uncategorized";
    if (!fixedWholesale.image) fixedWholesale.image = "default-image.jpg"; // Replace with a valid placeholder path

    return fixedWholesale;
}



// 显示AR批发产品的函数
function displayARWholesale(wholesale) {
    const arResultList = document.getElementById("arResultList");
    if (!arResultList) return;
    
    if (!wholesale) {
        arResultList.innerHTML = '<p>No wholesale item found from AR scan.</p>';
        return;
    }
    
    // 正确提取产品ID - 处理各种格式的ID
    let productId;
    if (wholesale._id && wholesale._id.$oid) {
        // 如果是MongoDB格式的ObjectId，使用$oid值
        productId = wholesale._id.$oid;
    } else if (typeof wholesale._id === 'string') {
        // 如果已经是字符串
        productId = wholesale._id;
    } else if (wholesale._id) {
        // 如果是其他对象形式，尝试提取字符串
        productId = wholesale._id.toString();
        // 处理toString可能返回"[object Object]"的情况
        if (productId === '[object Object]') {
            // 尝试获取对象上的任何有效ID字符串
            for (const key in wholesale._id) {
                if (typeof wholesale._id[key] === 'string') {
                    productId = wholesale._id[key];
                    break;
                }
            }
        }
    } else if (wholesale.id) {
        // 尝试使用替代ID字段
        productId = typeof wholesale.id === 'object' && wholesale.id.$oid ? 
            wholesale.id.$oid : wholesale.id.toString();
    } else {
        // 如果没有有效ID，生成一个唯一ID
        console.warn("No valid ID found for wholesale product, generating temporary ID");
        productId = generateObjectId();
    }
    
    // 提取其他值
    const price = wholesale.price && wholesale.price.$numberInt 
        ? parseInt(wholesale.price.$numberInt, 10) 
        : (typeof wholesale.price === 'number' ? wholesale.price : 0);
        
    const stock = wholesale.stock && wholesale.stock.$numberInt 
        ? parseInt(wholesale.stock.$numberInt, 10) 
        : (typeof wholesale.stock === 'number' ? wholesale.stock : 0);
        
    const minOrder = wholesale.minOrder && wholesale.minOrder.$numberInt 
        ? parseInt(wholesale.minOrder.$numberInt, 10) 
        : (typeof wholesale.minOrder === 'number' ? wholesale.minOrder : 6);
        
    const image = wholesale.image || '';
    const category = wholesale.category || 'Wholesale';
    
    const wholesaleCard = document.createElement('div');
    wholesaleCard.classList.add('product-card');
    wholesaleCard.setAttribute('data-id', productId);
    
    wholesaleCard.innerHTML = `
        <div class="product-image">
            <img src="${image}" alt="${wholesale.name}">
            <div class="ar-match-badge">Wholesale Item</div>
        </div>
        <div class="product-info">
            <h3 class="product-name">${wholesale.name}</h3>
            <p class="product-category">${category}</p>
            <p class="product-price">RM ${price.toFixed(2)}</p>
            <p class="product-min-order">Min Order: ${minOrder}</p>
            <p class="product-stock ${stock <= 0 ? 'out-of-stock' : ''}">
                ${stock > 0 ? `In Stock (${stock})` : 'Out of Stock'}
            </p>
            <button class="add-to-cart-btn" data-id="${productId}" ${stock <= 0 ? 'disabled' : ''}>
                ${stock > 0 ? 'Add to Cart' : 'Out of Stock'}
            </button>
        </div>
    `;
    
    // 为卡片添加点击处理程序，使用提取的产品ID
    wholesaleCard.addEventListener('click', (e) => {
        // 如果点击的是添加到购物车按钮，则不导航
        if (e.target.tagName === 'BUTTON' || e.target.classList.contains('add-to-cart-btn')) {
            e.preventDefault();
            e.stopPropagation();
        } else {
            // 导航到批发产品详细信息页面，使用提取的产品ID
            console.log(`Navigating to product details with ID: ${productId}`);
            window.location.href = `wholesaleDetails.html?id=${productId}`;
        }
    });
    
    // 为添加到购物车按钮添加特定的点击处理程序
    const addToCartBtn = wholesaleCard.querySelector('.add-to-cart-btn');
    if (addToCartBtn) {
        addToCartBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 防止导航
            if (typeof addToCart === 'function') {
                // 使用产品ID和数量调用添加到购物车函数
                addToCart(e, productId, productId, minOrder);
            } else {
                console.error("addToCart function not defined");
                // 后备实现
                alert(`Added ${wholesale.name} to cart (Min Order: ${minOrder})!`);
            }
        });
    }
    
    arResultList.appendChild(wholesaleCard);
    
    // 滚动到AR结果
    arResultList.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// 上传图片并从后端获取相似产品
function handleUpload() {
  const fileInput = document.getElementById('uploadInput');
  const file = fileInput.files[0];

  // 创建FormData对象，将文件附加到请求中
  const formData = new FormData();
  formData.append('image', file);

  // 发送请求到后端API获取相似的批发产品
  fetch('/search-wholesale', {
    method: 'POST',
    body: JSON.stringify({ image: formData }),
    headers: {
      'Content-Type': 'application/json'
    }
  })
  .then(response => response.json())
  .then(data => {
    displayResults(data);  // 显示返回的批发产品
  })
  .catch(error => console.error('Error:', error));
}

// 显示查询结果
function displayResults(products) {
  const resultContainer = document.getElementById('results');
  resultContainer.innerHTML = '';  // 清空现有的显示内容

  // 遍历结果并生成产品列表
  products.forEach(product => {
    const productDiv = document.createElement('div');
    productDiv.className = 'product';

    const productImage = document.createElement('img');
    productImage.src = product.image;
    productDiv.appendChild(productImage);

    const productName = document.createElement('p');
    productName.textContent = product.name;
    productDiv.appendChild(productName);

    resultContainer.appendChild(productDiv);
  });
}



    document.addEventListener('DOMContentLoaded', () => {
  const categoryFilter = document.getElementById('categoryFilter');
  
  // Fetch all categories and populate the dropdown
  async function populateCategories() {
  try {
    const response = await fetch('http://localhost:3000/api/wholesalesfilter');
    
    if (!response.ok) {
      throw new Error('Failed to fetch categories');
    }

    const data = await response.json();

    // Check if categories exist and is an array
    if (data.success && Array.isArray(data.categories)) {
      // Populate the dropdown with categories
      const categoryFilter = document.getElementById('categoryFilter');
      data.categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        categoryFilter.appendChild(option);
      });

      // Add "All Products" option
      const allOption = document.createElement('option');
      allOption.value = 'All Products';
      allOption.textContent = 'All Products';
      categoryFilter.appendChild(allOption);
    } else {
      console.error('Categories data is missing or not an array');
      document.getElementById('messageArea');
    }
  } catch (error) {
    console.error('Error fetching categories:', error);
    document.getElementById('messageArea').innerHTML = 'Error fetching categories. Please try again later.';
  }
}

  // Fetch and display all products (for "All Products" selection)
  async function loadWholesaleProducts() {
  try {
    const response = await fetch('http://localhost:3000/api/wholesales');
    if (!response.ok) throw new Error('HTTP error! Status: ${response.status}');
    
    const result = await response.json();
    if (!result.success || !Array.isArray(result.data)) throw new Error("No wholesale products found!");

    allProducts = result.data; // Store all products globally
    displayProducts(allProducts); // Display all products initially
  } catch (error) {
    console.error("❌ Error loading wholesale products:", error);
    alert("Error loading wholesale products: " + error.message);
    document.getElementById('messageArea').innerHTML = 'Error loading products. Please try again later.';
  }
}


  // Handle category selection change
  categoryFilter.addEventListener('change', async (e) => {
    const selectedCategory = e.target.value;
    console.log(`Selected category: ${selectedCategory}`);

    // When "All Products" is selected, load all products
    if (selectedCategory === 'All Products') {
      loadWholesaleProducts();
    } else {
      // Fetch filtered products based on the selected category
      try {
        const response = await fetch(`http://localhost:3000/api/wholesalesfilter?category=${encodeURIComponent(selectedCategory)}`);
        if (!response.ok) {
          throw new Error('Error fetching products');
        }

        const result = await response.json();

        if (result.success) {
          displayProducts(result.data);  // Display filtered products
        } else {
          document.getElementById('messageArea').textContent = 'No products found in this category.';
        }
      } catch (error) {
        console.error(error);
        document.getElementById('messageArea').textContent = 'An error occurred while fetching the products.';
      }
    }
  });



  // Initialize categories
  populateCategories();
});



    // Load products when the page loads
    document.addEventListener('DOMContentLoaded', loadWholesaleProducts);
</script>
