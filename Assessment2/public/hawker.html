<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hawker Products</title>
  <style>
    /* Simple styling for the product grid */
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px;
    }
    .product-card {
      width: 200px;
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .product-image img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .product-name {
      font-size: 1.2em;
      font-weight: bold;
    }
    .product-price {
      color: #007BFF;
      font-size: 1em;
      margin: 10px 0;
    }
    .add-to-cart-btn {
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
    }
    .add-to-cart-btn:disabled {
      background-color: #ccc;
    }
  </style>
</head>
<body>

  <h1>Hawker Products</h1>
  <div id="hawker-products" class="product-grid"></div>

  <script>
    // Function to fetch Hawker products from the server
    async function fetchHawkerProducts() {
      try {
        const response = await fetch('http://localhost:3000/api/products?category=Hawker');
        const products = await response.json();
        
        // Call function to display products
        displayHawkerProducts(products);
      } catch (error) {
        console.error('Error fetching products:', error);
        document.getElementById('hawker-products').innerHTML = 'Failed to load products.';
      }
    }

    // Function to display the fetched products
    function displayHawkerProducts(products) {
      const hawkerGrid = document.getElementById('hawker-products');
      hawkerGrid.innerHTML = ''; // Clear previous content

      if (Array.isArray(products) && products.length > 0) {
        products.forEach(product => {
          const price = product.price ?? 0;
          hawkerGrid.innerHTML += `
            <div class="product-card">
              <div class="product-image">
                <img src="${product.image || 'https://via.placeholder.com/200x150'}" 
                     alt="${product.name}">
              </div>
              <div class="product-info">
                <h3 class="product-name">${product.name}</h3>
                <div class="product-price">Price: RM${price.toFixed(2)}</div>
                <button class="add-to-cart-btn" 
                        onclick="addToCart(event, '${product._id}')"
                        ${product.stock <= 0 ? 'disabled' : ''}>
                        ${product.stock > 0 ? 'Add to Cart' : 'Out of Stock'}
                </button>
              </div>
            </div>
          `;
        });
      } else {
        hawkerGrid.innerHTML = 'No products found in this category.';
      }
    }

    // Function to add product to cart (You can implement this as needed)
    async function addToCart(event, productId) {
      event.preventDefault();
      alert('Product added to cart: ' + productId);  // For now, just alert the product ID
      // You can send a request to your backend to handle cart functionality
    }

    // Fetch products when the page loads
    window.onload = fetchHawkerProducts;
  </script>

</body>
</html>
