  <script>
    let allProducts = []; // Store all products

    async function fetchProducts() {
        try {
            const productList = document.getElementById('productList');
            productList.innerHTML = '<div class="loading">Loading products...</div>';

            console.log('Fetching products from API...');
            const response = await fetch('http://localhost:3000/api/products');
            console.log('Response status:', response.status);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            console.log('Products data:', data);

            if (!data.success) {
                throw new Error(data.message || 'Failed to fetch products');
            }

            allProducts = data.data; // Store fetched products

            if (!Array.isArray(allProducts) || allProducts.length === 0) {
                productList.innerHTML = '<div class="error">No products found</div>';
                return;
            }

            // Display products
            displayProducts(allProducts);

        } catch (error) {
            console.error('Error fetching products:', error);
            const productList = document.getElementById('productList');
            productList.innerHTML = `
                <div class="error">
                    Error loading products. Please try again later.<br>
                    Details: ${error.message}<br>
                    <button onclick="fetchProducts()" class="retry-button">Retry</button>
                </div>
            `;
        }
    }

    function displayProducts(products) {
    const productGrid = document.getElementById("productList");
    const messageArea = document.getElementById('messageArea');
    if (!productGrid) return;

    productGrid.innerHTML = ""; // Clear existing products

    if (!Array.isArray(products) || products.length === 0) {
        productGrid.innerHTML = '<p>No products found in this category.</p>';
        return;
    }

    products.forEach(product => {
        const price = product.price_per_unit ?? product.price ?? 0;
        const stock = product.stock ?? 0;
        const image = product.image_url ?? product.image ?? '';

        const productCard = document.createElement('div');
        productCard.classList.add('product-card');
        productCard.setAttribute('data-id', product._id);
        productCard.innerHTML = `
            <div class="product-image">
                <img src="${image}" alt="${product.name}">
            </div>
            <div class="product-info">
                <h3 class="product-name">${product.name}</h3>
                <p class="product-category">${product.category}</p>
                <p class="product-price">${price.toFixed(2)}</p>
                <p class="product-stock ${stock <= 0 ? 'out-of-stock' : ''}">
                    ${stock > 0 ? `In Stock (${stock})` : 'Out of Stock'}
                </p>
                <button onclick="addToCart(event, '${product._id}')" class="add-to-cart-btn" ${stock <= 0 ? 'disabled' : ''}>
                    ${stock > 0 ? 'Add to Cart' : 'Out of Stock'}
                </button>
            </div>
        `;

        productCard.addEventListener('click', () => {
    window.location.href = `productDetails.html?id=${product._id}`;
        });

        productGrid.appendChild(productCard);
    });
}


    function filterProducts() {
        const searchInput = document.getElementById('searchInput').value.toLowerCase();
        const filteredProducts = allProducts.filter(product => 
            product.name.toLowerCase().includes(searchInput)
        );
        displayProducts(filteredProducts);
    }

    // Load products when the page loads
    document.addEventListener('DOMContentLoaded', fetchProducts);

    // Add event listener to the search input
    document.getElementById('searchInput').addEventListener('input', filterProducts);

    async function addToCart(event, productId) {
        event.preventDefault(); // 阻止事件冒泡到产品卡片

        try {
            const userData = localStorage.getItem('userData');
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userData);
            console.log('Adding product to cart:', productId);

            const response = await fetch('http://localhost:3000/api/cart/${user._id}/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: user._id,
                    productId: productId,
                    quantity: 1
                })
            });

            const data = await response.json();
            console.log('Cart response:', data);

            if (data.success) {
                alert('Product added to cart successfully!');
            } else {
                throw new Error(data.message || 'Failed to add product to cart');
            }
        } catch (error) {
            console.error('Error adding to cart:', error);
            alert('Failed to add product to cart. Please try again.');
        }
    }

    const openARBtn = document.getElementById('openARBtn');
    const closeARBtn = document.getElementById('closeARBtn');
    const arForm = document.getElementById('arForm');
    const arFrame = document.getElementById('arFrame');
    const retryBtn = document.getElementById('retryBtn');
    // Open AR function
    openARBtn.addEventListener('click', () => {
    arForm.style.display = 'block';  // Show AR container
    arFrame.style.display = 'block';
    arFrame.src = 'ar.html';  // Load the external AR scene
});

// Close AR function
closeARBtn.addEventListener('click', () => {
    arForm.style.display = 'none';  // Hide AR form
    arFrame.style.display = 'none';
    arFrame.src = '';  // Unload the AR scene
});

retryBtn.addEventListener('click', () => {
    // Hide AR form and frame
    arForm.style.display = 'none';  
    arFrame.style.display = 'none';

    // Reload the AR scene instantly
    arFrame.src = 'about:blank'; // Reset the iframe completely
    arFrame.src = 'ar.html';  // Reload the AR scene

    // Show the AR view again
    arFrame.style.display = 'block';
    arForm.style.display = 'block';

    // Reset UI for new search
    searchBtn.style.display = 'block';  // Show search button
    retryBtn.style.display = 'none';  // Hide retry button
});

window.addEventListener("message", (event) => {

        console.log("Received AR prediction result:", matchedProduct);

        console.log("Full AR product data:", JSON.stringify(matchedProduct));

        // Fix any missing data in the product object
        const fixedProduct = ensureValidProductData(matchedProduct);

                #arResultList .product-card:hover {

                    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                }
                .ar-match-badge {
                    position: absolute;

                    display: flex;

                    justify-content: center;
                }

                    max-height: 100%;

                }
                .product-card .product-info {

                }
                .product-card .product-name {
                    font-size: 1.2rem;
                    margin-bottom: 5px;
                    font-weight: 600;
                }
                .product-card .product-category {
                    color: #666;

                    font-size: 0.9rem;
                }
                .product-card .product-price {

                }

                }

                }

            document.head.appendChild(styleElement);
        }

});

// Function to ensure product data has valid values
function ensureValidProductData(product) {
    if (!product) return null;
    
    // Create a copy to avoid modifying the original
    const fixedProduct = {...product};
    
    // Make sure the product has an ID
    if (!fixedProduct._id && fixedProduct.id) {
        fixedProduct._id = fixedProduct.id;
    } else if (!fixedProduct._id) {
        fixedProduct._id = generateObjectId(); // Generate a temporary ID
    }
    
    function generateObjectId() {
    const timestamp = Math.floor(new Date().getTime() / 1000).toString(16);
    const machineId = Math.floor(Math.random() * 16777216).toString(16).padStart(6, '0');
    const processId = Math.floor(Math.random() * 65536).toString(16).padStart(4, '0');
    const counter = Math.floor(Math.random() * 16777216).toString(16).padStart(6, '0');
    return timestamp + machineId + processId + counter;
}
    // Make sure category is not undefined
    if (!fixedProduct.category || fixedProduct.category === 'UNDEFINED') {
        fixedProduct.category = fixedProduct.productType || "KITCHENWARE";
    }
    
    // Make sure stock is a number and not undefined
    if (fixedProduct.stock === undefined || fixedProduct.stock === null) {
        fixedProduct.stock = 10; // Default to some stock
    } else {
        fixedProduct.stock = parseInt(fixedProduct.stock, 10);
    }
    
    // Make sure price is a number
    if (fixedProduct.price === undefined || fixedProduct.price === null) {
        if (fixedProduct.price_per_unit) {
            fixedProduct.price = fixedProduct.price_per_unit;
        } else {
            fixedProduct.price = 0;
        }
    } else {
        fixedProduct.price = parseFloat(fixedProduct.price);
    }
    
    return fixedProduct;
}

// Function to display AR product
function displayARProduct(product) {
    const arResultList = document.getElementById("arResultList");
    if (!arResultList) return;
    
    if (!product) {
        arResultList.innerHTML = '<p>No product found from AR scan.</p>';
        return;
    }
    
    // Use our fixed product data
    const price = parseFloat(product.price_per_unit || product.price || 0);
    const stock = parseInt(product.stock || 0, 10);
    const image = product.image_url || product.image || '';
    const category = product.category || 'KITCHENWARE';
    
    const productCard = document.createElement('div');
    productCard.classList.add('product-card');
    productCard.setAttribute('data-id', product._id);
    
    productCard.innerHTML = `
        <div class="product-image">
            <img src="${image}" alt="${product.name}">
            <div class="ar-match-badge">AR Match</div>
        </div>
        <div class="product-info">
            <h3 class="product-name">${product.name}</h3>
            <p class="product-category">${category}</p>
            <p class="product-price">RM ${price.toFixed(2)}</p>
            <p class="product-stock ${stock <= 0 ? 'out-of-stock' : ''}">
                ${stock > 0 ? `In Stock (${stock})` : 'Out of Stock'}
            </p>
            <button class="add-to-cart-btn" data-id="${product._id}" ${stock <= 0 ? 'disabled' : ''}>
                ${stock > 0 ? 'Add to Cart' : 'Out of Stock'}
            </button>
        </div>
    `;
    
    // Add click handler to the card for navigation to details
    productCard.addEventListener('click', (e) => {
        // Don't navigate if clicking on the add to cart button
        if (e.target.tagName === 'BUTTON' || e.target.classList.contains('add-to-cart-btn')) {
            e.preventDefault();
            e.stopPropagation();
        } else {
            // Navigate to product details with source=ar parameter
    window.location.href = `productDetails.html?id=${product._id}`;
        }
    });
    
    // Add specific click handler for the add to cart button
    const addToCartBtn = productCard.querySelector('.add-to-cart-btn');
    if (addToCartBtn) {
        addToCartBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent navigation
            const productId = addToCartBtn.getAttribute('data-id');
            if (typeof addToCart === 'function') {
                addToCart(e, productId);
            } else {
                console.error("addToCart function not defined");
                // Fallback implementation
                alert(`Added ${product.name} to cart!`);
            }
        });
    }
    
    arResultList.appendChild(productCard);
    
    // Scroll to AR result
    arResultList.scrollIntoView({ behavior: 'smooth', block: 'start' });
}


document.addEventListener('DOMContentLoaded', () => {
const categoryFilter = document.getElementById('categoryFilter');
const messageArea = document.getElementById('messageArea');
  const productGrid = document.getElementById('productList');
  let allProducts = [];
    
  // Fetch all categories and populate the dropdown
  async function populateCategories() {
  try {
    const response = await fetch('http://localhost:3000/api/productsfilter');
    
    if (!response.ok) {
      throw new Error('Failed to fetch categories');
    }

    const data = await response.json();

    // Check if categories exist and is an array
    if (data.success && Array.isArray(data.categories)) {
      // Populate the dropdown with categories
      const categoryFilter = document.getElementById('categoryFilter');
      data.categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        categoryFilter.appendChild(option);
      });

      // Add "All Products" option
      const allOption = document.createElement('option');
      allOption.value = 'All Products';
      allOption.textContent = 'All Products';
      categoryFilter.appendChild(allOption);
    } else {
      console.error('Categories data is missing or not an array');
      document.getElementById('messageArea');
    }
  } catch (error) {
    console.error('Error fetching categories:', error);
    document.getElementById('messageArea').innerHTML = 'Error fetching categories. Please try again later.';
  }
}

  // Fetch and display all products (for "All Products" selection)
  async function loadProducts() {
  try {
    const response = await fetch('http://localhost:3000/api/products');
    if (!response.ok) throw new Error('HTTP error! Status: ${response.status}');
    
    const result = await response.json();
    if (!result.success || !Array.isArray(result.data)) throw new Error("No products found!");

    allProducts = result.data; // Store all products globally
    displayProducts(allProducts); // Display all products initially
  } catch (error) {
    console.error("❌ Error loading products:", error);
    alert("Error loading products: " + error.message);
    document.getElementById('messageArea').innerHTML = 'Error loading products. Please try again later.';
  }
}

// Handle category selection change
categoryFilter.addEventListener('change', async (e) => {
    const selectedCategory = e.target.value;
    console.log(`Selected category: ${selectedCategory}`);

    // When "All Products" is selected, load all products
    if (selectedCategory === 'All Products') {
      loadProducts();
    } else {
      // Fetch filtered products based on the selected category
      try {
        const response = await fetch(`http://localhost:3000/api/productsfilter?category=${encodeURIComponent(selectedCategory)}`)

        if (!response.ok) {
          throw new Error('Error fetching products');
        }

        const result = await response.json();

        if (result.success) {
          displayProducts(result.data);  // Display filtered products
        } else {
          document.getElementById('messageArea').textContent = 'No products found in this category.';
        }
      } catch (error) {
        console.error(error);
        document.getElementById('messageArea').textContent = 'An error occurred while fetching the products.';
      }
    }
  });


  // Initialize categories
  populateCategories();
});


async function loadForecast() {
  try {
    // Define the productId (you can get this from the URL, or pass it dynamically)
    const productId = "6762801947e0fea81dd20116"; // Example product ID

    const url = `http://localhost:3000/api/products/forecast/${productId}`;
    const res = await fetch(url);  // Fetching the forecast data from the backend
    const data = await res.json(); // Parsing the response to JSON

    const forecastDiv = document.getElementById("forecastMessage");

    if (data.success && data.forecast.length > 0) {
      forecastDiv.innerHTML = data.forecast.map(item => 
        `<strong>${item.day}</strong>: Predicted Stock = ${item.predictedStock}`
      ).join("<br>");
    } else {
      forecastDiv.textContent = "✅ All products are sufficiently stocked.";
    }
  } catch (err) {
    document.getElementById("forecastMessage").textContent = "❌ Error loading forecast.";
    console.error("Forecast fetch failed:", err);
  }
}

document.addEventListener("DOMContentLoaded", loadForecast);
